<body>
      <div id="app-preloader" aria-live="polite" aria-busy="true">
            <div class="app-preloader__spinner"></div>
            <div class="app-preloader__text" id="app-preloader-text">Loading system...</div>
      </div>
      <div id="app"></div>
      <script>
            (function () {
                  try {
                        var locale = localStorage.getItem('locale') || 'en';
                        document.documentElement.setAttribute('lang', locale);
                        var textNode = document.getElementById('app-preloader-text');
                        if (!textNode) return;
                        textNode.textContent = locale === 'pl' ? 'Ładowanie systemu...' : 'Loading system...';
                  } catch (e) {
                        // Ignore preloader localization issues before app bootstrap.
                  }
            })();
      </script>

      <style>
            #app-preloader {
                  position: fixed;
                  inset: 0;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  gap: 0.85rem;
                  background: #f6f8fb;
                  font-family: 'Lato', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  z-index: 9999;
                  transition: opacity 0.25s ease, visibility 0.25s ease;
            }

            #app-preloader.is-hidden {
                  opacity: 0;
                  visibility: hidden;
                  pointer-events: none;
            }

            .app-preloader__spinner {
                  width: 3.35rem;
                  height: 3.35rem;
                  border: 4px solid rgba(107, 114, 128, 0.25);
                  border-top-color: #6b7280;
                  border-radius: 999px;
                  animation: app-preloader-spin 0.85s linear infinite;
            }

            .app-preloader__text {
                  color: #374151;
                  font-size: 1.02rem;
                  font-weight: 600;
                  letter-spacing: 0.01em;
            }

            @keyframes app-preloader-spin {
                  to {
                        transform: rotate(360deg);
                  }
            }
      </style>
</body>
